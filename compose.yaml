services:
  api:
    image: muse-api
    build: 
      context: .
      target: runapi
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: muse
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/muse?sslmode=disable"
    depends_on:
      - postgres
    ports:
      - 3000:3000
    
  tests:
    image: muse-tests
    build: 
      context: .
      target: runtests
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: muse-test
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/muse-test?sslmode=disable"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-bullseye
    ports: 
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
